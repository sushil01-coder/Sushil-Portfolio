<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        <p class="subtitle">First to score points wins!</p>

        <div class="score-board">
            <div class="score">
                <span id="player-score">0</span>
                <p>You</p>
            </div>
            <div class="score">
                <span id="computer-score">0</span>
                <p>Computer</p>
            </div>
        </div>

        <div class="display-choices">
            <p id="game-status">Choose your weapon to start the match!</p>
        </div>

        <div class="choices-grid">
            <button onclick="playGame('✊')">✊ Rock</button>
            <button onclick="playGame('✋')">✋ Paper</button>
            <button onclick="playGame('✌️')">✌️ Scissors</button>
        </div>
        
        <button id="reset-btn" onclick="resetGame()">Reset Match</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
